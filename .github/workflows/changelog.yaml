name: CHANGELOG related checks per pull requests

on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  merge_group:
    types: [checks_requested]

# Dependabot PRs only bump dependencies and do not (and should not) edit the
# changelog, so the changelog checks are skipped for them.
jobs:
  check-changelog:
    name: Check changelog action
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: tarides/changelog-check-action@v3
        with:
          changelog: CHANGELOG.md

  check-changelog-commit:
    name: Check changelog is in a dedicated commit
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download script
        run: |
          curl -sSLO https://raw.githubusercontent.com/dannywillems/toolbox/main/changelog/check-commit.sh
          chmod +x check-commit.sh
      - name: Verify CHANGELOG.md changes are in their own commit
        run: ./check-commit.sh "${{ github.event.pull_request.base.sha }}"
