[package]
name = "ferrel"
version = "0.1.0"
edition = "2024"
description = "A typed Rust eDSL that generates Emacs Lisp (.el) plugins."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dannywillems/ferrel"
readme = "README.md"
keywords = ["emacs", "elisp", "dsl", "codegen", "transpiler"]
categories = ["development-tools", "compilers"]

[workspace]
members = ["ferrel-macros"]

[dependencies]
ferrel-macros = { version = "0.1.0", path = "ferrel-macros" }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.117", features = ["full"] }

[[bin]]
name = "ferrel-transpile"
path = "src/bin/transpile.rs"

# Regression tests live under tests/regression/ and are grouped into one test
# crate via its main.rs aggregator. Add new regression files there as `mod`s.
[[test]]
name = "regression"
path = "tests/regression/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
